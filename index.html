<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌀 陀螺賽事管理平台</title><link rel="stylesheet" href="styles.css"></head><body><header><div><b>🌀 陀螺賽事管理平台</b><small> 主審・裁判・參賽者 MVP</small></div><button id="reset">重設示範</button></header><main><section class="hero"><span>LIVE DEMO</span><h1 id="title">10/7 大鯊魚比賽</h1><p>三種角色共用的現場賽事操作原型</p></section><nav><button class="tab on" data-t="chief">👑 主審</button><button class="tab" data-t="ref">🧑‍⚖️ 裁判</button><button class="tab" data-t="player">🧑‍🎮 參賽者</button></nav><section id="chief" class="panel on"><div class="cols"><article><h2>比賽設定</h2><div class="form"><label>比賽名稱<input id="ename" value="10/7 大鯊魚比賽"></label><label>參賽人數<input id="pc" type="number" value="10" min="2"></label><label>場地數<input id="cc" type="number" value="4" min="1" max="8"></label><label>取前幾名<input id="top" type="number" value="4" min="1"></label></div><button id="apply" class="primary">套用設定</button><div id="format" class="notice"></div></article><article><h2>裁判管理</h2><div id="refs"></div></article></div><article><h2>現場控制塔</h2><div id="tower" class="courts"></div></article><article><h2>名次與下一場</h2><div class="notice">🏆 冠軍／🥈亞軍由決賽結果產生；設定前 3、前 4 等名次後，系統可安排對應排名戰。</div></article></section><section id="ref" class="panel"><article><div class="row"><h2>🧑‍⚖️ 裁判操作</h2><select id="court"></select><button id="join">模擬掃描 QR 加入</button></div><div id="match"></div></article></section><section id="player" class="panel"><article><div class="row"><h2>🧑‍🎮 公開比賽頁</h2><select id="follow"></select><button id="change">更換玩家</button></div><div id="next" class="next"></div><div id="bracket"></div></article></section></main><div id="toast"></div><script src="app.js"></script></body></html>
